server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

jwt:
  secret: nobuHotelSecretKeyForJWTTokenGeneration2024
  expiration: 86400000 # 24 hours


logging:
  level:
    com.nobu.hotel: DEBUG
    org.springframework.security: DEBUG
